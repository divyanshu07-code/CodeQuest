{% extends "base.html" %}

{% block title %}Add Contest - CodeQuest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <span class="page-eyebrow"><span class="dot"></span> new entry</span>
        <div class="term">
            <div class="term-bar">
                <span class="term-dot r"></span>
                <span class="term-dot y"></span>
                <span class="term-dot g"></span>
                <span class="term-title">codequest — add_contest.session — zsh</span>
            </div>
            <div class="term-body">
                <div class="code-preview" aria-hidden="true" style="background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 16px; font-size: 0.78rem; line-height: 1.6; margin-bottom: 22px; white-space: pre; overflow-x: auto;"><span style="color:#3b4351;display:inline-block;width:16px;">1</span><span style="color:var(--purple);">const</span> <span style="color:var(--blue);">contest</span> <span style="color:var(--dim);">=</span> <span style="color:var(--green);">{}</span><span style="color:var(--dim);">;</span>
<span style="color:#3b4351;display:inline-block;width:16px;">2</span>
<span style="color:#3b4351;display:inline-block;width:16px;">3</span><span style="color:var(--cyan);">contests</span><span style="color:var(--dim);">.</span><span style="color:var(--cyan);">push</span><span style="color:var(--dim);">(</span><span style="color:var(--blue);">contest</span><span style="color:var(--dim);">);</span> <span style="color:#4b5568;font-style:italic;">// press ⏎ to run</span></div>

                <form method="POST" novalidate>
                    <div class="field">
                        <label for="contest_name"><span class="tag">str</span> contest_name <span class="req">*</span></label>
                        <div class="input-shell">
                            <span class="prefix">&gt;</span>
                            <input type="text" id="contest_name" name="contest_name" placeholder="e.g., Codeforces Round 500" required autofocus>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="field">
                                <label for="platform"><span class="tag">enum</span> platform <span class="req">*</span></label>
                                <div class="input-shell">
                                    <span class="prefix">&gt;</span>
                                    <select id="platform" name="platform" required>
                                        <option value="">Select Platform</option>
                                        <option value="LeetCode">LeetCode</option>
                                        <option value="CodeForces">CodeForces</option>
                                        <option value="HackerRank">HackerRank</option>
                                        <option value="AtCoder">AtCoder</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="field">
                                <label for="contest_date"><span class="tag">date</span> contest_date <span class="req">*</span></label>
                                <div class="input-shell">
                                    <span class="prefix">&gt;</span>
                                    <input type="date" id="contest_date" name="contest_date" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="field">
                                <label for="rank"><span class="tag">int</span> rank <span class="opt">optional</span></label>
                                <div class="input-shell">
                                    <span class="prefix">&gt;</span>
                                    <input type="number" id="rank" name="rank" placeholder="e.g., 125">
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="field">
                                <label for="rating_change"><span class="tag">int</span> rating_change <span class="opt">optional</span></label>
                                <div class="input-shell">
                                    <span class="prefix">&gt;</span>
                                    <input type="number" id="rating_change" name="rating_change" placeholder="e.g., +50 or -10">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Add Contest
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
