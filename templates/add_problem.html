{% extends "base.html" %}

{% block title %}Add Problem - CodeQuest{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Add Problem</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="problem_name" class="form-label">Problem Name *</label>
                        <input type="text" class="form-control" id="problem_name" name="problem_name" 
                               placeholder="e.g., Two Sum" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="platform" class="form-label">Platform *</label>
                            <select class="form-select" id="platform" name="platform" required>
                                <option value="">Select Platform</option>
                                <option value="LeetCode">LeetCode</option>
                                <option value="CodeForces">CodeForces</option>
                                <option value="HackerRank">HackerRank</option>
                                <option value="AtCoder">AtCoder</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="difficulty" class="form-label">Difficulty *</label>
                            <select class="form-select" id="difficulty" name="difficulty" required>
                                <option value="">Select Difficulty</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="topic" class="form-label">Topic</label>
                            <input type="text" class="form-control" id="topic" name="topic" 
                                   placeholder="e.g., Hash Map">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="solved_date" class="form-label">Date Solved *</label>
                            <input type="date" class="form-control" id="solved_date" name="solved_date" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="/" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-check"></i> Add Problem
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
