{% extends "base.html" %}

{% block title %}Error - CodeQuest{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 50vh;">
    <div class="term" style="max-width: 480px; width: 100%;">
        <div class="term-bar">
            <span class="term-dot r"></span>
            <span class="term-dot y"></span>
            <span class="term-dot g"></span>
            <span class="term-title">codequest — exception.trace</span>
        </div>
        <div class="term-body text-center">
            <div style="font-size: 2.6rem; margin-bottom: 6px;">⚠️</div>
            <h2 class="mb-3" style="font-size: 1.4rem;">Oops! Something went wrong</h2>
            <div class="code-preview" style="background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 16px; font-size: 0.82rem; text-align: left; color: var(--red); margin-bottom: 22px;">{{ error }}</div>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
